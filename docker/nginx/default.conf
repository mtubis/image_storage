server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Matches php.ini's upload_max_filesize/post_max_size (docker/php/php.ini)
    # so an oversized upload gets Laravel's 422, not nginx's bare 413.
    client_max_body_size 10M;

    # Infra healthcheck endpoint, independent of the app (which isn't
    # scaffolded until step 0.2, so backend/public doesn't exist yet).
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
