; Matches nginx's client_max_body_size (docker/nginx/templates/default.conf.template) so an
; oversized upload gets Laravel's 422 validation response, not a bare 413.
upload_max_filesize = 10M
post_max_size = 10M

memory_limit = 512M
max_execution_time = 60

; The app stores everything in UTC and converts only for the Katowice
; weather lookup; this must match that assumption.
date.timezone = UTC

expose_php = Off

; Laravel renders its own errors; whatever PHP reports itself (e.g. a fatal error Laravel can't
; catch) goes to the container log rather than into an API response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
