; Matches nginx's client_max_body_size (docker/nginx/default.conf) so an
; oversized upload gets Laravel's 422 validation response, not a bare 413.
upload_max_filesize = 10M
post_max_size = 10M

memory_limit = 512M
max_execution_time = 60

; The app stores everything in UTC and converts only for the Katowice
; weather lookup (see CLAUDE.md); this must match that assumption.
date.timezone = UTC

expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
