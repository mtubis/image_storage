services:
  php: &php-service
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_UID: ${DOCKER_UID:-1000}
        APP_GID: ${DOCKER_GID:-1000}
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_TIMEZONE: UTC
      # Base of the absolute thumbnail URLs the API returns (the nginx port on the host).
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: image_storage
      DB_USERNAME: image_storage
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Runs the same image as `php`; the entrypoint waits for the Laravel app
  # to exist (it isn't scaffolded until step 0.2) and then starts the worker.
  # php's healthcheck (fpm listener on :9000) doesn't apply here, so it's
  # disabled rather than inherited as a false negative.
  queue:
    <<: *php-service
    entrypoint: ["/usr/local/bin/queue-entrypoint.sh"]
    healthcheck:
      disable: true

  db:
    image: mariadb:11
    environment:
      # Dev-only defaults; not used outside this local compose stack.
      MARIADB_DATABASE: image_storage
      MARIADB_USER: image_storage
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Loopback-only: convenient for a local GUI client, not reachable from the LAN.
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: docker/frontend
      args:
        APP_UID: ${DOCKER_UID:-1000}
        APP_GID: ${DOCKER_GID:-1000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    restart: unless-stopped

volumes:
  db-data:
