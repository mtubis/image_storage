services:
  php: &php-service
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_UID: ${DOCKER_UID:-1000}
        APP_GID: ${DOCKER_GID:-1000}
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      # Base of the absolute thumbnail URLs the API returns (the nginx port on the host).
      APP_URL: http://localhost:8000
      # The only origin allowed by CORS (the Vite dev server on the host).
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: image_storage
      DB_USERNAME: image_storage
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      # Loopback-only, like db and frontend: an unauthenticated API with upload and delete
      # should not be reachable from the LAN.
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      # The image's entrypoint renders templates/*.template into conf.d with envsubst.
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      # Allowed origin of nginx's own 413 response; must match the app's CORS config.
      FRONTEND_URL: http://localhost:5173
      # Substitute only this variable, never nginx's own $uri, $query_string, ...
      NGINX_ENVSUBST_FILTER: ^FRONTEND_URL$
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Runs the same image as `php`; the entrypoint waits for backend/vendor to
  # appear in the bind mount and then starts the worker.
  # php's healthcheck (fpm listener on :9000) doesn't apply here, so it's
  # disabled rather than inherited as a false negative.
  queue:
    <<: *php-service
    entrypoint: ["/usr/local/bin/queue-entrypoint.sh"]
    healthcheck:
      disable: true

  db:
    image: mariadb:11
    environment:
      # Dev-only defaults; not used outside this local compose stack.
      MARIADB_DATABASE: image_storage
      MARIADB_USER: image_storage
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Loopback-only, for a local GUI client. Not 3306 (a local MySQL/MariaDB) nor 33060
      # (MySQL 8's X Protocol); the containers still reach it as db:3306.
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: docker/frontend
      args:
        APP_UID: ${DOCKER_UID:-1000}
        APP_GID: ${DOCKER_GID:-1000}
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Read by Vite from the process environment; the browser calls the API on the host port.
      # Fixed like APP_URL and FRONTEND_URL, which it must agree with (CORS, absolute URLs).
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    working_dir: /app
    # Ready once Vite answers, so `up --wait` (make setup) covers the npm ci on a fresh clone.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      # Generous for a first npm ci into a bind mount (slow on Docker Desktop for macOS);
      # a healthy check ends the start period early, so it costs nothing otherwise.
      start_period: 300s
    restart: unless-stopped

volumes:
  db-data:
